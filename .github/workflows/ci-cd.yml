name: MedVault CI/CD Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Build native parser with compiler hardening
        run: >
          gcc -shared -fPIC -O2 -Wall -Wextra
          -fstack-protector-strong -D_FORTIFY_SOURCE=2 -Wl,-z,relro,-z,now
          -o native/libparser.so native/parser.c

      - name: AddressSanitizer check of native parser (300-byte name)
        run: |
          gcc -g -fsanitize=address -o native/demo_asan native/demo.c native/parser.c
          ./native/demo_asan "MVLAB|$(python3 -c 'print("A"*300)')|NOT-SIGNED"

      - name: Security regression tests (exploit replay)
        if: always()
        run: |
          mkdir -p static
          pytest -v tests --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit semgrep

      - name: Bandit full report (all severities)
        run: bandit -r . -x ./tests -f json -o bandit-report.json || true

      - name: Semgrep report
        run: semgrep scan --config p/python --config p/flask --json -o semgrep-report.json || true

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            bandit-report.json
            semgrep-report.json

      - name: Security gate - fail on HIGH severity (Bandit)
        run: bandit -r . -x ./tests -lll

  docker-scan:
    name: Docker build + Trivy + OWASP ZAP
    needs: [build-and-test, sast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t medvault:${{ github.sha }} .

      - name: Trivy image scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: medvault:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start container for DAST
        run: |
          docker run -d --name medvault -p 5000:5000 -e MEDVAULT_SECRET_KEY=ci-only-secret medvault:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf http://localhost:5000/login > /dev/null && break; sleep 2; done
          curl -sI http://localhost:5000/login

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5000/login"
          fail_action: false
          allow_issue_writing: false
